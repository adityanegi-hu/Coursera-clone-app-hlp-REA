syntax = "proto3";

package coursera.proto.mobilebff.learntab.v1;

import "coursera/proto/mobilebff/learntab/v1/learn_tab.proto";
import "coursera/proto/shared/v1/authorization.proto";
import "coursera/proto/shared/v1beta1/coursera_annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Mobilebff.Learntab.V1";
option go_package = "learntabv1";
option java_multiple_files = true;
option java_outer_classname = "LearnTabApiProto";
option java_package = "org.coursera.proto.mobilebff.learntab.v1";
option objc_class_prefix = "CPML";
option php_namespace = "Coursera\\Proto\\Mobilebff\\Learntab\\V1";
option swift_prefix = "MobilebffLearntab";

// A Service to collect and return information for the mobile learn tab.
service LearnTabAPI {
  option deprecated = true;
  option (coursera.proto.shared.v1beta1.service_metadata) = {
    api_usage_type: API_USAGE_TYPE_RESTRICTED
    service_allowlist: []
  };

  // Get learn tab information.
  rpc GetLearnTab(GetLearnTabRequest) returns (GetLearnTabResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/GetLearnTab"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/GetLearnTab"}
    };
  }
  // Get user level goal information.
  rpc GetUserLevelGoal(GetUserLevelGoalRequest) returns (GetUserLevelGoalResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/GetUserLevelGoal"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/GetUserLevelGoal"}
    };
  }
  // Set user level goal.
  rpc SetUserLevelGoal(SetUserLevelGoalRequest) returns (SetUserLevelGoalResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/SetUserLevelGoal"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/SetUserLevelGoal"}
    };
  }
  // Delete user level goal.
  rpc DeleteUserLevelGoal(DeleteUserLevelGoalRequest) returns (DeleteUserLevelGoalResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/DeleteUserLevelGoal"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v1/LearnTabAPI/DeleteUserLevelGoal"}
    };
  }
}

message GetLearnTabRequest {}

message GetLearnTabResponse {
  repeated LearnTabItem items = 1;
}

message GetUserLevelGoalRequest {}

message GetUserLevelGoalResponse {
  // The number of days to learn per week to meet the goal. If not set then the user does not have a goal set.
  google.protobuf.Int32Value goal_days_per_week = 1;
  // The number of days completed in the current week.
  google.protobuf.Int32Value days_completed = 2;
}

message SetUserLevelGoalRequest {
  // The number of days to learn per week to meet the goal.
  int32 goal_days_per_week = 1;
}

message SetUserLevelGoalResponse {
  // User level goal id.
  string id = 1;
}

message DeleteUserLevelGoalRequest {}

message DeleteUserLevelGoalResponse {
  // User level goal id.
  string id = 1;
}
