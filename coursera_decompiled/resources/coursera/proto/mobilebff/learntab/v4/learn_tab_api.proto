syntax = "proto3";

package coursera.proto.mobilebff.learntab.v4;

import "coursera/proto/mobilebff/learntab/v4/learn_tab.proto";
import "coursera/proto/mobilebff/shared/v2/program.proto";
import "coursera/proto/mobilebff/shared/v3/product_type.proto";
import "coursera/proto/shared/v1/authorization.proto";
import "coursera/proto/shared/v1beta1/coursera_annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Mobilebff.Learntab.V4";
option go_package = "learntabv4";
option java_multiple_files = true;
option java_outer_classname = "LearnTabApiProto";
option java_package = "org.coursera.proto.mobilebff.learntab.v4";
option objc_class_prefix = "CPML";
option php_namespace = "Coursera\\Proto\\Mobilebff\\Learntab\\V4";
option swift_prefix = "MobilebffLearntabV4";

// A Service to collect and return information for the mobile learn tab.
service LearnTabAPI {
  option (coursera.proto.shared.v1beta1.service_metadata) = {
    api_usage_type: API_USAGE_TYPE_RESTRICTED
    service_allowlist: []
  };

  // Get learn tab information.
  rpc GetLearnTab(GetLearnTabRequest) returns (GetLearnTabResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetLearnTab"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetLearnTab"}
    };
  }
  // Get learn tab program switcher.
  rpc GetLearnTabProgramSwitcher(GetLearnTabProgramSwitcherRequest) returns (GetLearnTabProgramSwitcherResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetLearnTabProgramSwitcher"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetLearnTabProgramSwitcher"}
    };
  }

  rpc UnEnrollFromCourse(UnEnrollFromCourseRequest) returns (UnEnrollFromCourseResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/UnEnrollFromCourse"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/UnEnrollFromCourse"}
    };
  }

  rpc EnrollInCourse(EnrollInCourseRequest) returns (EnrollInCourseResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/EnrollInCourse"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/EnrollInCourse"}
    };
  }

  rpc GetAllCoursesInSeries(GetAllCoursesInSeriesRequest) returns (GetAllCoursesInSeriesResponse) {
    option (coursera.proto.shared.v1.authorization) = {
      allows: ["logged.in"]
    };
    option (google.api.http) = {
      post: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetAllCoursesInSeries"
      body: "*"
      additional_bindings: {get: "/api/grpc/mobilebff/learntab/v4/LearnTabAPI/GetAllCoursesInSeries"}
    };
  }
}

message GetLearnTabRequest {
  google.protobuf.StringValue program_id = 1;
  //Offset for pagination.
  optional int32 offset = 2;
  // Maximum number of results to return.
  optional int32 limit = 3;
  // Cursor for pagination. Omit to start from the beginning.
  optional string cursor = 4;
}

message GetLearnTabResponse {
  optional Header header = 1;
  repeated LearnTabCourse items = 2;
  // next offset
  optional int32 next_offset = 3;
  // total items for user
  int32 total_items = 4;
  // Cursor for fetching the next page of results.
  optional string next_cursor = 5;
}

message GetLearnTabProgramSwitcherRequest {}

message GetLearnTabProgramSwitcherResponse {
  repeated shared.v2.ProgramInfo program_info = 1;
}

message UnEnrollFromCourseRequest {
  // ID of course to unenroll from
  string course_id = 1;
  // Program ID if user is enrolled in course through program
  google.protobuf.StringValue program_id = 2;
}

message UnEnrollFromCourseResponse {}

message EnrollInCourseRequest {
  // ID of course to unenroll from
  string course_id = 1;
  // Program ID if user is enrolled in course through program
  optional string program_id = 2;
  Role role = 3;

  enum Role {
    ROLE_INVALID = 0;
    ROLE_LEARNER = 1;
    ROLE_PRE_ENROLL = 2;
  }
  optional string parent_id = 4;
}

message EnrollInCourseResponse {}

message GetAllCoursesInSeriesRequest {
  string specialization_id = 1;
  google.protobuf.StringValue program_id = 2;
}

message GetAllCoursesInSeriesResponse {
  string id = 1;
  string slug = 2;
  string name = 3;
  // Used to tell if this is a specialization or professional certificate.
  shared.v3.ProductType product_type = 4;
  repeated Course courses = 5;
}
