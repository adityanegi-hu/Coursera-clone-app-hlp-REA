syntax = "proto3";

package coursera.proto.mobilebff.shared.v2;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Mobilebff.Shared.V2";
option go_package = "sharedv2";
option java_multiple_files = true;
option java_outer_classname = "CourseInstructorProto";
option java_package = "org.coursera.proto.mobilebff.shared.v2";
option objc_class_prefix = "CPMS";
option php_namespace = "Coursera\\Proto\\Mobilebff\\Shared\\V2";
option swift_prefix = "MobilebffShared";

// This file contains message types representing course instructors for
// XDP and Course Home Page on mobilebff.

// Container for a course instructor.
message CourseInstructor {
  string id = 1;
  string full_name = 2;
  google.protobuf.StringValue photo = 3;
  google.protobuf.StringValue title = 4;
  google.protobuf.StringValue bio = 5;
  google.protobuf.StringValue department = 6;
}
