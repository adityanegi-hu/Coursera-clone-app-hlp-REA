syntax = "proto3";

package coursera.proto.mobilebff.shared.v2;

option csharp_namespace = "Coursera.Proto.Mobilebff.Shared.V2";
option go_package = "sharedv2";
option java_multiple_files = true;
option java_outer_classname = "NextStepProto";
option java_package = "org.coursera.proto.mobilebff.shared.v2";
option objc_class_prefix = "CPMS";
option php_namespace = "Coursera\\Proto\\Mobilebff\\Shared\\V2";
option swift_prefix = "MobilebffShared";

// All possible next step types.
enum NextStepType {
  NEXT_STEP_TYPE_INVALID = 0;
  NEXT_STEP_TYPE_COURSE_MATERIAL = 1;
  NEXT_STEP_TYPE_SWITCH_SESSION = 2;
  NEXT_STEP_TYPE_COURSE_COMPLETED = 3;
  NEXT_STEP_TYPE_SESSION_ENDED = 4;
  NEXT_STEP_TYPE_COURSE_SCHEDULE_ADJUSTMENT = 5;
  NEXT_STEP_TYPE_MULTIPLE_DEADLINES = 6;
  NEXT_STEP_TYPE_NO_ACTIVE_SESSION = 7;
  NEXT_STEP_TYPE_NO_ENROLLABLE_SESSIONS = 8;
}
