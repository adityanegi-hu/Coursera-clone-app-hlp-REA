syntax = "proto3";

package coursera.proto.mobilebff.shared.v4;

option csharp_namespace = "Coursera.Proto.Mobilebff.Shared.V4";
option go_package = "sharedv4";
option java_multiple_files = true;
option java_outer_classname = "TranslatedLanguageProto";
option java_package = "org.coursera.proto.mobilebff.shared.v4";
option objc_class_prefix = "CPMS";
option php_namespace = "Coursera\\Proto\\Mobilebff\\Shared\\V4";
option swift_prefix = "MobilebffSharedV4";

// The language a course is available in used across mobile-bff.
message TranslatedLanguage {
  string language_code = 1;
  bool is_machine_translated = 2;
}
