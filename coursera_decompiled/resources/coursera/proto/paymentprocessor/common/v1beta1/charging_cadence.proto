// Cadence in which to charge a Subscription.
enum ChargingCadence {
  CHARGING_CADENCE_INVALID = 0;
  CHARGING_CADENCE_MONTHLY = 1;
  CHARGING_CADENCE_ANNUAL = 2;
  CHARGING_CADENCE_BIANNUAL = 3;
}
