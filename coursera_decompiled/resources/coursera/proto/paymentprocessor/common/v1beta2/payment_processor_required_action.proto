syntax = "proto3";

package coursera.proto.paymentprocessor.common.v1beta2;

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Common.V1Beta2";
option go_package = "commonv1beta2";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorRequiredActionProto";
option java_package = "org.coursera.proto.paymentprocessor.common.v1beta2";
option objc_class_prefix = "CPPC";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Common\\V1Beta2";

// additional action required by payment processor
message PaymentProcessorRequiredAction {
  oneof action {
    PaymentProcessorRequiredActionUrlRedirect url_redirect = 1;
  }
}

message PaymentProcessorRequiredActionUrlRedirect {
  // url to redirect
  string url = 1;
}
