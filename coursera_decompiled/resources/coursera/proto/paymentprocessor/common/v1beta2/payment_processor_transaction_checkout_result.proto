syntax = "proto3";

package coursera.proto.paymentprocessor.common.v1beta2;

import "coursera/proto/paymentprocessor/common/v1beta1/payment_processor_exception_details.proto";
import "coursera/proto/paymentprocessor/common/v1beta2/payment_processor_required_action.proto";
import "coursera/proto/paymentprocessor/common/v1beta2/payment_processor_transaction.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Common.V1Beta2";
option go_package = "commonv1beta2";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorTransactionCheckoutResultProto";
option java_package = "org.coursera.proto.paymentprocessor.common.v1beta2";
option objc_class_prefix = "CPPC";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Common\\V1Beta2";

// Result of the Transaction Checkout
message PaymentProcessorTransactionCheckoutResult {
  // Result
  oneof result {
    PaymentProcessorTransactionCheckoutSuccessResult success_result = 1;
    PaymentProcessorTransactionCheckoutFailureResult failure_result = 2;
    PaymentProcessorTransactionCheckoutPendingResult pending_result = 3;
  }
}

// Container for a success result.
message PaymentProcessorTransactionCheckoutSuccessResult {
  // Payment processor transaction.
  PaymentProcessorTransaction payment_processor_transaction = 1;
}

// Container for a failure result.
message PaymentProcessorTransactionCheckoutFailureResult {
  // Exception details of the failure.
  coursera.proto.paymentprocessor.common.v1beta1.PaymentProcessorExceptionDetails exception_details = 1;
  // (Optional) Payment processor transaction if one was created.
  PaymentProcessorTransaction payment_processor_transaction = 2;
}

// Container for a pending result.
message PaymentProcessorTransactionCheckoutPendingResult {
  // Additional action needed to completed payment.
  optional PaymentProcessorRequiredAction payment_processor_required_action = 1;
  // (Optional) Payment processor reference id of the Transaction Checkout.
  optional string payment_processor_checkout_reference_id = 2;
}
