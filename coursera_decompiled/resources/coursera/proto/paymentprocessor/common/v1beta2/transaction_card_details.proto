syntax = "proto3";

package coursera.proto.paymentprocessor.common.v1beta2;

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Common.V1Beta2";
option go_package = "commonv1beta2";
option java_multiple_files = true;
option java_outer_classname = "TransactionCardDetailsProto";
option java_package = "org.coursera.proto.paymentprocessor.common.v1beta2";
option objc_class_prefix = "CPPC";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Common\\V1Beta2";

// card details associated with a transaction
message TransactionCardDetails {
  // card type
  string card_type = 1;
  // card expiration month
  string exp_month = 2;
  // card expiration year
  string exp_year = 3;
  // card last 4 digits
  string last_4 = 4;
}
