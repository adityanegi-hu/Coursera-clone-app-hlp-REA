syntax = "proto3";

package coursera.proto.paymentprocessor.events.v1beta1;

import "coursera/proto/paymentprocessor/common/v1beta1/payment_processor_transaction.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Events.V1Beta1";
option go_package = "eventsv1beta1";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorTransactionCheckoutEventProto";
option java_package = "org.coursera.proto.paymentprocessor.events.v1beta1";
option objc_class_prefix = "CPPE";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Events\\V1Beta1";

// Event that is fired when a Transaction result has been received via webhook by a Payment Processor.
message PaymentProcessorTransactionCheckoutEvent {
  // Cart ID used for mapping this transaction back to internal data.
  uint64 cart_id = 1;
  // Payment processor transaction.
  coursera.proto.paymentprocessor.common.v1beta1.PaymentProcessorTransaction payment_processor_transaction = 2;
}
