syntax = "proto3";

package coursera.proto.paymentprocessor.events.v1beta2;

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Events.V1Beta2";
option go_package = "eventsv1beta2";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorPaymentMethodDeletedEventProto";
option java_package = "org.coursera.proto.paymentprocessor.events.v1beta2";
option objc_class_prefix = "CPPE";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Events\\V1Beta2";

// Event that is fired when a payment method is deleted from the payment processor
message PaymentProcessorPaymentMethodDeletedEvent {
  // The ID of the payment method (from payment-processor DB) that was deleted.
  int64 deleted_payment_method_id = 1;
}
