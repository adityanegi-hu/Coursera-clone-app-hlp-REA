syntax = "proto3";

package coursera.proto.paymentprocessor.events.v1beta2;

import "coursera/proto/paymentprocessor/common/v1beta2/payment_processor_subscription_renewal_result.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Events.V1Beta2";
option go_package = "eventsv1beta2";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorSubscriptionRenewalEventProto";
option java_package = "org.coursera.proto.paymentprocessor.events.v1beta2";
option objc_class_prefix = "CPPE";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Events\\V1Beta2";

// Event is fired when a Subscription renewal webhook has been received from a Payment Processor.
message PaymentProcessorSubscriptionRenewalEvent {
  // Result of the Subscription Renewal
  coursera.proto.paymentprocessor.common.v1beta2.PaymentProcessorSubscriptionRenewalResult result = 1;
}
