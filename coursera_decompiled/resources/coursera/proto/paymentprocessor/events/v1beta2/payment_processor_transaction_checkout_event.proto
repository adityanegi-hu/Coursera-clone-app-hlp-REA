syntax = "proto3";

package coursera.proto.paymentprocessor.events.v1beta2;

import "coursera/proto/paymentprocessor/common/v1beta2/payment_processor_transaction_checkout_result.proto";
import "coursera/proto/sharedpayments/v1/payment_processor_id.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.Events.V1Beta2";
option go_package = "eventsv1beta2";
option java_multiple_files = true;
option java_outer_classname = "PaymentProcessorTransactionCheckoutEventProto";
option java_package = "org.coursera.proto.paymentprocessor.events.v1beta2";
option objc_class_prefix = "CPPE";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\Events\\V1Beta2";

// Event that is fired when a Transaction result has been received via webhook by a Payment Processor.
message PaymentProcessorTransactionCheckoutEvent {
  // Checkout Reference ID used for mapping this transaction back to internal data.
  string payment_processor_checkout_reference_id = 1;
  // Result of the Transaction Checkout
  coursera.proto.paymentprocessor.common.v1beta2.PaymentProcessorTransactionCheckoutResult result = 2;
  // Payment processor id in which the checkout event belongs to.
  coursera.proto.sharedpayments.v1.PaymentProcessorId payment_processor_id = 3;
  // Cart ID associated with this checkout event. Used for fallback lookup when
  // payment_processor_checkout_reference_id is not stored on the CheckoutIntent (e.g. S2S checkouts).
  // Nullable — absent when cartId is not available in the payment processor's metadata.
  google.protobuf.Int64Value cart_id = 4;
}
