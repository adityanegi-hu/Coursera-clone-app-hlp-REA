// The type of voided purchases that that should be returned in `ListVoidedPurchases`.
enum GooglePlayVoidedPurchaseType {
  GOOGLE_PLAY_VOIDED_PURCHASE_TYPE_INVALID = 0;
  GOOGLE_PLAY_VOIDED_PURCHASE_TYPE_IN_APP_PURCHASE_ONLY = 1;
  GOOGLE_PLAY_VOIDED_PURCHASE_TYPE_IN_APP_AND_SUBSCRIPTION = 2;
}
