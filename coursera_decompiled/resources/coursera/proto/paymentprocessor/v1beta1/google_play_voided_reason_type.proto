  GOOGLE_PLAY_VOIDED_REASON_TYPE_FRIENDLY_FRAUD = 7;
  GOOGLE_PLAY_VOIDED_REASON_TYPE_CHARGEBACK = 8;
  GOOGLE_PLAY_VOIDED_REASON_TYPE_UNACKNOWLEDGED_PURCHASE = 9;
