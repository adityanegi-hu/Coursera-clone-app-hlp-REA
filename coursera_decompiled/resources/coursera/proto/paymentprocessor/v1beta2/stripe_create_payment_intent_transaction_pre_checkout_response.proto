syntax = "proto3";

package coursera.proto.paymentprocessor.v1beta2;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.V1Beta2";
option go_package = "paymentprocessorv1beta2";
option java_multiple_files = true;
option java_outer_classname = "StripeCreatePaymentIntentTransactionPreCheckoutResponseProto";
option java_package = "org.coursera.proto.paymentprocessor.v1beta2";
option objc_class_prefix = "CPP";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\V1Beta2";

// Details about the pre checkout response for single transaction.
message StripeCreatePaymentIntentTransactionPreCheckoutResponse {
  // The payment intent id which will be conformed on FE.
  google.protobuf.StringValue payment_intent_id = 1;
  // The payment intent secret.
  google.protobuf.StringValue payment_intent_client_secret = 2;
}
