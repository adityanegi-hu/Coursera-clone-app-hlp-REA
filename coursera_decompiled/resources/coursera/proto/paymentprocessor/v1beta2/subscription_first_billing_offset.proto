syntax = "proto3";

package coursera.proto.paymentprocessor.v1beta2;

import "coursera/proto/paymentprocessor/v1beta2/time_period.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.V1Beta2";
option go_package = "paymentprocessorv1beta2";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionFirstBillingOffsetProto";
option java_package = "org.coursera.proto.paymentprocessor.v1beta2";
option objc_class_prefix = "CPP";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\V1Beta2";

// SubscriptionFirstBillingOffset contains information on when the subscription is first charged.
message SubscriptionFirstBillingOffset {
  // Does the subscription have a free trial.
  google.protobuf.BoolValue is_free_trial = 1;
  // Duration of the free trial. The user will be charged after current time + offset_duration.
  // If is_free_trial is false then free_trial_duration will default to 0 seconds.
  TimePeriod offset_duration = 2;
}
