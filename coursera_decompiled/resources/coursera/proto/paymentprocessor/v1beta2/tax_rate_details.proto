syntax = "proto3";

package coursera.proto.paymentprocessor.v1beta2;

import "coursera/proto/shared/v1/big_decimal.proto";
import "coursera/proto/sharedpayments/v1/payment_transaction_billing_info.proto";
import "coursera/proto/sharedpayments/v1beta1/tax_behavior.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Paymentprocessor.V1Beta2";
option go_package = "paymentprocessorv1beta2";
option java_multiple_files = true;
option java_outer_classname = "TaxRateDetailsProto";
option java_package = "org.coursera.proto.paymentprocessor.v1beta2";
option objc_class_prefix = "CPP";
option php_namespace = "Coursera\\Proto\\Paymentprocessor\\V1Beta2";

message TaxRateDetails {
  google.protobuf.StringValue tax_rate_id = 1;
  google.protobuf.StringValue display_name = 2;
  coursera.proto.shared.v1.BigDecimal percentage = 3;
  coursera.proto.sharedpayments.v1.PaymentTransactionBillingInfo billing_info = 4;
  coursera.proto.sharedpayments.v1beta1.TaxBehavior tax_behavior = 5;
}
