syntax = "proto3";

package coursera.proto.paymentscheckout.events.v2beta1;

import "coursera/proto/paymentscheckout/common/v2beta1/payment_transaction_end.proto";

option csharp_namespace = "Coursera.Proto.Paymentscheckout.Events.V2Beta1";
option go_package = "eventsv2beta1";
option java_multiple_files = true;
option java_outer_classname = "OneTimeCheckoutFailureEventProto";
option java_package = "org.coursera.proto.paymentscheckout.events.v2beta1";
option objc_class_prefix = "CPPE";
option php_namespace = "Coursera\\Proto\\Paymentscheckout\\Events\\V2Beta1";

// Event that is published when a one time checkout attempt has failed.
message OneTimeCheckoutFailureEvent {
  // Id of the cart that was attempted to be checked out.
  int64 cart_id = 1;
  // The payment transaction end written as a result.
  coursera.proto.paymentscheckout.common.v2beta1.PaymentTransactionEnd payment_transaction_end = 2;
}
