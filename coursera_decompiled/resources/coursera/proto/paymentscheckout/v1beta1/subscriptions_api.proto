syntax = "proto3";

package coursera.proto.paymentscheckout.v1beta1;

import "coursera/proto/paymentscheckout/common/v2beta1/subscription.proto";
import "coursera/proto/shared/v1beta1/coursera_annotations.proto";
import "coursera/proto/sharedpayments/v1/payment_processor_id.proto";
import "coursera/proto/sharedpayments/v1/subscription_processor_id.proto";

option csharp_namespace = "Coursera.Proto.Paymentscheckout.V1Beta1";
option go_package = "paymentscheckoutv1beta1";
option java_multiple_files = true;
option java_outer_classname = "SubscriptionsApiProto";
option java_package = "org.coursera.proto.paymentscheckout.v1beta1";
option objc_class_prefix = "CPP";
option php_namespace = "Coursera\\Proto\\Paymentscheckout\\V1Beta1";

// Service that contains all subscriptions logic and interactions.
service SubscriptionsAPI {
  option (coursera.proto.shared.v1beta1.service_metadata) = {
    api_usage_type: API_USAGE_TYPE_RESTRICTED
    service_allowlist: ["payment-processor-jobs"]
  };

  // Get subscriptions for given payment processor subscription ids .
  rpc FindAllByPaymentProcessorSubscriptionIds(FindAllByPaymentProcessorSubscriptionIdsRequest) returns (FindAllByPaymentProcessorSubscriptionIdsResponse);
}

message FindAllByPaymentProcessorSubscriptionIdsRequest {
  // Payment processor id.
  coursera.proto.sharedpayments.v1.PaymentProcessorId payment_processor_id = 1 [deprecated = true];
  // List of payment processor subscription ids.
  repeated string payment_processor_subscription_ids = 2;
  // Subscription processor id.
  coursera.proto.sharedpayments.v1.SubscriptionProcessorId subscription_processor_id = 3;
}

message FindAllByPaymentProcessorSubscriptionIdsResponse {
  // List of payment processor subscriptions which are present in the subscriptions table.
  repeated coursera.proto.paymentscheckout.common.v2beta1.Subscription subscriptions = 1;
}
