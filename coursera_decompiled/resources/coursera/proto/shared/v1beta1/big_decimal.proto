syntax = "proto3";

package coursera.proto.shared.v1beta1;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Shared.V1Beta1";
option go_package = "sharedv1beta1";
option java_multiple_files = true;
option java_outer_classname = "BigDecimalProto";
option java_package = "org.coursera.proto.shared.v1beta1";
option objc_class_prefix = "CPS";
option php_namespace = "Coursera\\Proto\\Shared\\V1Beta1";

// The first two fields are inspired by https://github.com/googleapis/googleapis/blob/master/google/type/money.proto
message BigDecimal {
  // The whole units.
  int64 units = 1;

  // Number of nano (10^-9) units.
  // The value must be between -999,999,999 and +999,999,999 inclusive.
  // If `units` is positive, `nanos` must be positive or zero.
  // If `units` is zero, `nanos` can be positive, zero, or negative.
  // If `units` is negative, `nanos` must be negative or zero.
  // For example -1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
  int32 nanos = 2;

  // An optional field to specify the scale of the BigDecimal
  google.protobuf.Int32Value scale = 3;
}
