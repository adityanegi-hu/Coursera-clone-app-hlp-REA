syntax = "proto3";

package coursera.proto.sharedentitlement.v1beta1;

import "coursera/proto/sharedentitlement/v1beta1/product_type.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Sharedentitlement.V1Beta1";
option go_package = "sharedentitlementv1beta1";
option java_multiple_files = true;
option java_outer_classname = "ProductIdProto";
option java_package = "org.coursera.proto.sharedentitlement.v1beta1";
option objc_class_prefix = "CPS";
option php_namespace = "Coursera\\Proto\\Sharedentitlement\\V1Beta1";

// A model to identify a Coursera product.
message ProductId {
  ProductType product_type = 1;
  google.protobuf.StringValue product_item_id = 2;
}
