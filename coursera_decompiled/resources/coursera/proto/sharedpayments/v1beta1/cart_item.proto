syntax = "proto3";

package coursera.proto.sharedpayments.v1beta1;

import "coursera/proto/shared/v1/big_decimal.proto";
import "coursera/proto/sharedentitlement/v1beta1/product_id.proto";
import "coursera/proto/sharedpayments/v1beta1/product_action.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Coursera.Proto.Sharedpayments.V1Beta1";
option go_package = "sharedpaymentsv1beta1";
option java_multiple_files = true;
option java_outer_classname = "CartItemProto";
option java_package = "org.coursera.proto.sharedpayments.v1beta1";
option objc_class_prefix = "CPS";
option php_namespace = "Coursera\\Proto\\Sharedpayments\\V1Beta1";

// Components of the cart that a user is interested in checking out for.
message CartItem {
  // CartItem ID.
  int64 id = 1;
  // The parent cart's id.
  int64 cart_id = 2;
  // Product id that is being actioned upon.
  coursera.proto.sharedentitlement.v1beta1.ProductId product_id = 3;
  // What action the user wants to take on the product, such as "buy".
  ProductAction product_action = 5;
  // The ID to the product pricing table, which has the amount to charge/refund.
  google.protobuf.Int64Value price_id = 6;
  // The V2 ID to the product pricing table, which has the amount to charge/refund.
  google.protobuf.StringValue product_price_id_v2 = 7;
  // The amount of the cart item after discount, NOT including taxes if any.
  coursera.proto.shared.v1.BigDecimal amount = 8;
  // The amount of the cart item before discount.
  coursera.proto.shared.v1.BigDecimal original_amount = 9;
  // Optional coupon id.
  google.protobuf.Int64Value coupon_id = 10;
  // The cart item that is being refunded by this cart item. If none, this is a purchase.
  google.protobuf.Int64Value cart_item_id_to_refund = 11;
  // The cart item container (e.g. specialization).
  google.protobuf.Int64Value parent_cart_item_id = 12;
  // Mirrors the CartItemMetadata courier enum in infra-services.
  CartItemMetadata metadata = 13;
}

// Wrapper around CartItem with some additional information.
// A cart that has been validated and prepared for checkout by our system.
// Formerly known as CartItemWithComputed.
message ValidatedCartItem {
  // CartItem ID.
  int64 id = 1;
  // CartItem that is being wrapped.
  CartItem cart_item = 2;
  // Promotion information for this cartItem if applicable.
  ProductPromotionInfo promotion_info = 3;
}

// Mirrors CartItemMetadata courier enum in infra-services.
// Does not yet include all the metadata that is available in the courier enum.
message CartItemMetadata {
  oneof union {
    // Metadata for a CourseraTierLite subscription.
    CourseraTierLiteCartItemMetadata coursera_tier_lite_cart_item_metadata = 1;
    // Metadata for a CourseraPlusSubscription subscription.
    CourseraPlusSubscriptionCartItemMetadata coursera_plus_subscription_cart_item_metadata = 2;
    // Metadata for a SpecializationSubscription subscription.
    SpecializationSubscriptionCartItemMetadata specialization_subscription_cart_item_metadata = 3;
    // Metadata for a VerifiedCertificate subscription.
    VerifiedCertificateCartItemMetadata verified_certificate_cart_item_metadata = 4;
  }
}

// Metadata for a CourseraTierLite subscription.
message CourseraTierLiteCartItemMetadata {
  // Subscription payment type; Whether it is an initial checkout or a subsequent payment.
  SubscriptionCartItemMetadataPaymentType payment_type = 1;
  // We should only enroll them in at most one content while they checkout Coursera Lite.
  ProductEnrollmentInformation product_enrollment_information = 2;
}

// Metadata for a CourseraPlusSubscription subscription.
message CourseraPlusSubscriptionCartItemMetadata {
  // Subscription payment type; Whether it is an initial checkout or a subsequent payment.
  SubscriptionCartItemMetadataPaymentType payment_type = 1;
  // We should only enroll them in at most one content while they checkout Coursera Plus.
  ProductEnrollmentInformation product_enrollment_information = 2;
  // Upgrade variants for Coursera Plus subscriptions.
  CourseraPlusSubscriptionUpgradeVariants upgrade_variants = 3;
}

// Metadata for a SpecializationSubscription subscription.
message SpecializationSubscriptionCartItemMetadata {
  // Subscription payment type; Whether it is an initial checkout or a subsequent payment.
  SubscriptionCartItemMetadataPaymentType payment_type = 1;
}

// Metadata for a VerifiedCertificate cart item.
message VerifiedCertificateCartItemMetadata {
  // Some ProductControllers enroll users in s12ns when they receive EntitlementEvents.
  // Some EntitlementEvents (those generated by enterprise code) use
  // EntitlementEventWhitelistedS12nEnrollments specify that the ProductController should only
  // enroll users in certain s12ns.
  repeated string whitelisted_s12n_enrollments = 1;
  // Right now we use the isEnterprise flag to determine if the VerifiedCertificate checked out was
  // from enterprise and appropriately change the email body.
  bool is_enterprise = 2;
  // Some enterprise customers want to enroll their learners in private sessions.
  // In this case enterprise will set this flag to true so that payment's doesn't enroll the user
  // in the public session. In this case programs will be responsible for enrolling the user in the
  // correct private session.
  bool skip_enroll_in_session = 3;
}

// Upgrade variants for Coursera Plus subscriptions.
message CourseraPlusSubscriptionUpgradeVariants {
  // Variant name
  PriceVariant price_variant = 1;
  // Overridden number of trial days.
  google.protobuf.Int32Value free_trial_in_days_override = 2;
  // Metadata for an email regarding this variant.
  UpgradeEmailParameters email_parameters = 3;
  // Promo code id, a.k.a. promotion name.
  google.protobuf.StringValue next_billing_promotion = 4;
}

// Variant name.
message PriceVariant {
  // Variant name.
  string variant_name = 1;
}

// Metadata for an email regarding this variant.
message UpgradeEmailParameters {
  // CourseId to display.
  google.protobuf.StringValue course_id_to_display = 1;
  // Upgraded productId.
  coursera.proto.sharedentitlement.v1beta1.ProductId upgraded_product_id = 2;
  // Additional discount promotion code.
  google.protobuf.StringValue additional_discount_promo_code = 3;
}

// Subscription payment type; Whether it is an initial checkout or a subsequent payment.
enum SubscriptionCartItemMetadataPaymentType {
  SUBSCRIPTION_CART_ITEM_METADATA_PAYMENT_TYPE_INVALID = 0;
  // Used to trigger different side effects based off what type of payment a subscription checkout
  // Represents. Right now we only have the need to distinguish between INITIAL_CHECKOUT and
  // SUBSEQUENT_PAYMENT, but we may find a need for other actions like REFUND.
  SUBSCRIPTION_CART_ITEM_METADATA_PAYMENT_TYPE_INITIAL_CHECKOUT = 1;
  // Any payment after the initial checkout payment. Deliberately chose not to call it
  // RECURRING_PAYMENT since that means both initial and subsequent payments in the context of our
  // store. Also didn't call it installment because generally we only use that to mean subsequent
  // payment for a terminal subscription.
  SUBSCRIPTION_CART_ITEM_METADATA_PAYMENT_TYPE_SUBSEQUENT_PAYMENT = 2;
}

// Information for the product promotion.
// Note that when a coupon ID is present in the cart item, it will also require product promotion
// information to be present as well.
message ProductPromotionInfo {
  // ID of the promotion.
  int64 promotion_id = 1;
  // Name of the promotion.
  string promotion_name = 2;
  // Discount Percentage applied, if a discount percent was used (vs a flat discount amount).
  google.protobuf.Int32Value discount_percent = 3;
  // Calculated discount amount based on either the discountPercent or the flat amount used.
  coursera.proto.shared.v1.BigDecimal discount_amount = 4;
  // Number of billing cycles for the promotion; used for multi-month promos.
  google.protobuf.Int32Value number_of_billing_cycles = 5;
}

// Used when users purchase CourseraTierSubscription through an CDP or SDP. After users purchase
// CourserTierSubscription, we also need to enroll them into the corresponding course or s12n.
message ProductEnrollmentInformation {
  // The product to enroll with purchasing CourseraTierSubscription.
  string product_id_to_enroll = 1;
  // Users can enroll in courseraTierSubscription through any CDP in an s12n. In this case, the user
  // should get the membership for that course instead of just going through normal s12n
  // enrollment flow which will grant the membership of the first course in the s12n
  google.protobuf.StringValue course_id_to_grant_membership = 2;
}
