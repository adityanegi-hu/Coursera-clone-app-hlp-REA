syntax = "proto3";

package coursera.proto.sharedpayments.v1beta1;

option csharp_namespace = "Coursera.Proto.Sharedpayments.V1Beta1";
option go_package = "sharedpaymentsv1beta1";
option java_multiple_files = true;
option java_outer_classname = "TaxBehaviorProto";
option java_package = "org.coursera.proto.sharedpayments.v1beta1";
option objc_class_prefix = "CPS";
option php_namespace = "Coursera\\Proto\\Sharedpayments\\V1Beta1";

// Tax Behavior.
enum TaxBehavior {
  TAX_BEHAVIOR_INVALID = 0;
  // Inclusive tax is already included in the price.
  TAX_BEHAVIOR_INCLUSIVE = 1;
  // Exclusive tax is added on top of the price.
  TAX_BEHAVIOR_EXCLUSIVE = 2;
  // Tax is not charged.
  TAX_BEHAVIOR_NOT_CHARGED = 3;
}
